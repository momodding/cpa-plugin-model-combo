name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check out minimum supported CPA v8.0.37
        uses: actions/checkout@v7
        with:
          repository: router-for-me/CLIProxyAPI
          ref: ce07d189b3de2a39d37fd68ae093b102ce3aabee
          path: .cpa-source
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check formatting
        run: test -z "$(gofmt -l ./*.go)"
      - name: Check release scripts
        run: bash -n .github/xgo/*.sh
      - name: Check workflow syntax
        shell: bash
        run: |
          set -euo pipefail
          orm_lint_dir="$(mktemp -d "$RUNNER_TEMP/orm-actionlint.XXXXXX")"
          cleanup() {
            for orm_file in "$orm_lint_dir/actionlint.tar.gz" "$orm_lint_dir/actionlint"; do
              if [[ -f "$orm_file" ]]; then rm -- "$orm_file"; fi
            done
            rmdir -- "$orm_lint_dir"
            echo "orm.tools.cleanup passed"
          }
          trap cleanup EXIT
          curl --fail --silent --show-error --location --max-time 60 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$orm_lint_dir/actionlint.tar.gz"
          printf '%s  %s\n' \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            "$orm_lint_dir/actionlint.tar.gz" | sha256sum --check -
          tar -xzf "$orm_lint_dir/actionlint.tar.gz" -C "$orm_lint_dir" actionlint
          "$orm_lint_dir/actionlint" \
            .github/workflows/test.yml .github/workflows/codeql.yml \
            .github/workflows/ai-pr-review.yml .github/workflows/maintenance.yml \
            .github/workflows/test-ai.yml
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - name: Test minimum supported CPA integration
        run: CPA_SOURCE="$GITHUB_WORKSPACE/.cpa-source" go test -tags=integration ./... -count=1
      - name: Build native plugin
        if: ${{ !cancelled() }}
        run: |
          mkdir -p dist
          CGO_ENABLED=1 go build -trimpath -buildmode=c-shared -o dist/model-router.so .
      - name: Install browser test dependencies
        if: ${{ !cancelled() }}
        run: npm ci
      - name: Test dashboard in a disposable CPA instance
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          fixture="$(mktemp -d "$RUNNER_TEMP/dashboard-e2e.XXXXXX")"
          cpa_pid=""
          # shellcheck disable=SC2329 # Invoked by the EXIT trap.
          cleanup() {
            if [[ -n "$cpa_pid" ]]; then
              kill "$cpa_pid" 2>/dev/null || true
              for _ in {1..50}; do kill -0 "$cpa_pid" 2>/dev/null || break; sleep 0.1; done
              kill -9 "$cpa_pid" 2>/dev/null || true
              wait "$cpa_pid" 2>/dev/null || true
            fi
            rm -rf -- "$fixture"
          }
          trap cleanup EXIT
          mkdir -p "$fixture/plugins" "$fixture/auth"
          cp dist/model-router.so "$fixture/plugins/model-router.so"
          (cd .cpa-source && go build -o "$fixture/cli-proxy-api" ./cmd/server)
          port="$(python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')"
          cat > "$fixture/config.yaml" <<EOF
          host: "127.0.0.1"
          port: $port
          auth-dir: "$fixture/auth"
          api-keys: ["dashboard-e2e-client-key"]
          request-retry: 0
          usage-statistics-enabled: true
          remote-management:
            allow-remote: false
            secret-key: "dashboard-e2e-management-key"
            disable-control-panel: true
          plugins:
            enabled: true
            dir: "$fixture/plugins"
            configs:
              model-router:
                enabled: true
                routes: []
          openai-compatibility:
            - name: dashboard-e2e
              base-url: "http://127.0.0.1:9/v1"
              api-key-entries:
                - api-key: dashboard-e2e-fake-provider-key
              models:
                - name: dashboard-e2e-model-a
                - name: dashboard-e2e-model-b
          EOF
          "$fixture/cli-proxy-api" --config "$fixture/config.yaml" > "$fixture/cpa.log" 2>&1 &
          cpa_pid=$!
          base_url="http://127.0.0.1:$port"
          ready=false
          for _ in {1..100}; do
            if curl --fail --silent --max-time 1 -H 'Authorization: Bearer dashboard-e2e-management-key' \
              "$base_url/v0/management/plugins/model-router/accounts" > "$fixture/accounts.json" && \
              jq -e '[.credentials[].models[].id] | (index("dashboard-e2e-model-a") != null and index("dashboard-e2e-model-b") != null)' "$fixture/accounts.json" > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$cpa_pid" 2>/dev/null; then break; fi
            sleep 0.2
          done
          if [[ "$ready" != true ]]; then
            echo 'Disposable CPA did not become ready with both fixture models' >&2
            cat "$fixture/cpa.log" >&2
            exit 1
          fi
          export DASHBOARD_URL="$base_url/v0/resource/plugins/model-router/config"
          export DASHBOARD_MANAGEMENT_KEY=dashboard-e2e-management-key
          export DASHBOARD_E2E_ALLOW_MUTATIONS=1
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE=/usr/bin/google-chrome
          status=0
          npm run test:e2e || status=$?
          # Best effort: the final state of the disposable instance, captured while it is still running.
          export DASHBOARD_E2E_SCREENSHOTS="$RUNNER_TEMP/dashboard-e2e-screenshots"
          mkdir -p "$DASHBOARD_E2E_SCREENSHOTS"
          node --input-type=module <<'JS' || echo '::warning::dashboard screenshots were not captured'
          import { chromium } from 'playwright-core';
          const browser = await chromium.launch({ executablePath: process.env.PLAYWRIGHT_CHROMIUM_EXECUTABLE, headless: true, args: ['--no-sandbox', '--disable-setuid-sandbox'] });
          try {
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
            await page.goto(process.env.DASHBOARD_URL, { waitUntil: 'domcontentloaded' });
            await page.locator('#management-key').fill(process.env.DASHBOARD_MANAGEMENT_KEY);
            await page.locator('#connect').click();
            await page.locator('#model-status[data-tone="ready"]').waitFor();
            await page.screenshot({ path: `${process.env.DASHBOARD_E2E_SCREENSHOTS}/configuration.png`, fullPage: true });
            await page.getByRole('tab', { name: 'Usage tracking' }).click();
            await page.locator('#usage-panel').waitFor({ state: 'visible' });
            await page.screenshot({ path: `${process.env.DASHBOARD_E2E_SCREENSHOTS}/usage.png`, fullPage: true });
          } finally {
            await browser.close();
          }
          JS
          exit "$status"
      - name: Upload dashboard screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-e2e-screenshots
          path: ${{ runner.temp }}/dashboard-e2e-screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7

  windows-sqlite:
    runs-on: windows-latest
    env:
      CGO_ENABLED: "1"
      CC: gcc
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify native Windows toolchain and source
        run: |
          git rev-parse HEAD
          go env GOOS GOARCH CGO_ENABLED CC
          gcc --version
      - name: Test Windows SQLite paths and registration
        run: go test ./... -run '^(TestSQLite|TestUsageStoreDataPaths|TestUsageStoreRelativePathPersists|TestABIRegistration|TestLegacy)' -count=1 -v
